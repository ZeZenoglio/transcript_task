[project]
name = "transcript-task"
version = "0.1.0"
description = "Local speech-to-text utility: audio recordings in, reviewed Word transcripts out."
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "datasets>=5.0.1",
    "jiwer>=4.0.0",
    "mlflow>=3.16.1",
    "mlx-whisper>=0.4.3",
    "num2words>=0.5.14",
    "ollama>=0.6.2",
    "pt-core-news-sm",
    "pydantic-settings>=2.6.0",
    "python-docx>=1.2.0",
    "sentence-transformers>=6.1.0",
    "spacy>=3.8.16",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/transcript_task"]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "integration: hits a real local service (Ollama, mlx-whisper); slower, opt-in.",
]
# Default `pytest` run stays fast and offline; opt into integration explicitly
# with `pytest -m integration` (see Phase 10 for the full test-tier layout).
addopts = "-m 'not integration'"

[tool.uv.sources]
pt-core-news-sm = { url = "https://github.com/explosion/spacy-models/releases/download/pt_core_news_sm-3.8.0/pt_core_news_sm-3.8.0-py3-none-any.whl" }
