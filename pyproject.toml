[project]
name = "transcript-task"
version = "0.1.0"
description = "Local speech-to-text utility: audio recordings in, reviewed Word transcripts out."
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "mlx-whisper>=0.4.3",
    "ollama>=0.6.2",
    "pydantic-settings>=2.6.0",
    "python-docx>=1.2.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/transcript_task"]
